<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
 --p:#159765;
 --pd:#08764c;
 --bg:#f1faf5;
 --soft:#e1f4e9;
 --ink:#17382b;
 --muted:#668074;
 --line:#dcebe2;
 --danger:#bd3445;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;
 padding:0;
 min-height:100vh;
 min-height:100dvh;
}
body{
 background:linear-gradient(135deg,#e5f6eb,#f6fbf7);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
 color:var(--ink);
 display:flex;
 justify-content:center;
 -webkit-text-size-adjust:100%;
}
.app{
 width:100%;
 max-width:1000px;

 min-height:100dvh;
 display:flex;

 position:relative;
}
header{
 background:linear-gradient(130deg,var(--p),var(--pd));
 color:white;
 padding:calc(14px + env(safe-area-inset-top)) 20px 14px;

 justify-content:space-between;

 position:sticky;
 top:0;

}
header h1{font-size:1.25rem;margin:0;line-height:1.2}

.header-right{

 gap:8px;

}
.sync-pill{
 display:inline-flex;

 gap:6px;
 padding:5px 9px;
 border-radius:999px;
 font-size:.7rem;

 background:rgba(255,255,255,.16);
 color:#fff;
 border:1px solid rgba(255,255,255,.28);
 white-space:nowrap;
}
.sync-pill.offline{
 background:rgba(255,247,223,.95);
 color:#725915;
 border-color:#f3d27a;
}
.sync-dot{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#7dffb8;
 box-shadow:0 0 6px #7dffb8;

}

 background:#c2820a;

}
main{
 padding:18px 20px;
 flex:1;
 overflow-y:auto;

 padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:1000px;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 background:white;
 border-top:1px solid var(--line);
 padding:8px 6px calc(8px + env(safe-area-inset-bottom));
 z-index:5;
}

 border:0;

 color:var(--muted);

 font-weight:600;

}

nav button.active{background:var(--soft);color:var(--pd)}
.hidden{display:none!important}

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  align-items: start;
 }

 main > .section-title {

 }
 nav {

  border-top: 1px solid var(--line);
 }

@media(min-width:1024px){
 main {
  grid-template-columns: repeat(3, 1fr);
 }
 main > .card.full-width,
 main > .section-title {
  grid-column: span 3;
 }
}

.card{
 background:white;

 border-radius:16px;
 padding:18px;
 margin-bottom:16px;

}
.profile{text-align:center;padding:22px}
.avatar{

 background:var(--soft);
 display:grid;place-items:center;
 font-size:2rem;flex-shrink:0;

.profile .avatar{
 margin:0 auto 12px;

}
h2{font-size:1.15rem;margin:0 0 6px}
h3{font-size:1rem;margin:0 0 10px}
.muted{color:var(--muted);font-size:.82rem;line-height:1.45}

 background:#f5fbf7;border:1px solid var(--line);

}
.stat strong{display:block;font-size:1.4rem;color:var(--pd)}

}
.btn.secondary{background:var(--soft);color:var(--pd)}
.btn.outline{background:white;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:7px 11px;min-height:36px;margin:0;font-size:.75rem}
.btn.danger{background:#fff0f0;color:var(--danger)}
input,select,textarea{
 width:100%;padding:11px 12px;border:1px solid var(--line);
 border-radius:10px;margin:5px 0 10px;font:inherit;
 font-size:16px;
 background:white;color:var(--ink);

}
select{
 background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
 background-position:calc(100% - 16px) calc(50% - 2px),calc(100% - 11px) calc(50% - 2px);
 background-size:5px 5px,5px 5px;
 background-repeat:no-repeat;
 padding-right:30px;
}
textarea{min-height:75px;resize:vertical}
label{font-size:.82rem;font-weight:650;display:block}
.tag{
 display:inline-block;background:var(--soft);color:var(--pd);

}
.notice{

.item{padding:10px 0;border-bottom:1px solid var(--line)}

.toast{

 transform:translateX(-50%);background:#17382b;color:white;
 padding:10px 18px;border-radius:10px;z-index:9;font-size:.85rem;
 max-width:90%;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.2);

.section-title{margin:4px 2px 12px}
.pill{

 background:var(--soft);color:var(--pd);font-size:.75rem;

.chart-container {

.chip-group{

.chip-btn{

.pass-wrap{

.pass-wrap input{

.pass-toggle{

.pass-toggle:hover{
 background:var(--soft);

}
.pr-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
 gap:10px;
 margin-top:8px;
}
.pr-card{
 background:#f5fbf7;
 border:1px solid var(--line);
 border-radius:12px;
 padding:11px;
}
.pr-card b{display:block;font-size:.9rem;margin-bottom:4px}
.pr-card small{display:block;color:var(--muted);font-size:.75rem;line-height:1.4}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
 outline:2px solid var(--p);outline-offset:2px;
}
@media(min-width:768px){
 body{padding:20px}
 .app{min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);border-radius:20px;overflow:hidden}
 nav{border-radius:0 0 20px 20px;max-width:none;left:0;transform:none;width:100%}
}
</style>

<div class="app">

<header>
 <div>
  <h1>💪 Gym Bros</h1>
  <small>Entrena en comunidad</small>
 </div>
 <div class="header-right">
  <span id="sync-badge" class="sync-pill offline" title="Estado de sincronización en la nube">
   <span class="sync-dot"></span>
   <span id="sync-label">Local</span>
  </span>
  <button type="button" class="btn small" onclick="go('account')">👤 Mi cuenta</button>
 </div>
</header>

<main id="main"></main>

<nav id="nav" aria-label="Navegación principal">
 <button type="button" data-tab="home" onclick="go('home')"><span>⌂</span>Inicio</button>
 <button type="button" data-tab="discover" onclick="go('discover')"><span>🤝</span>Conectar</button>
 <button type="button" data-tab="progress" onclick="go('progress')"><span>📈</span>Progreso</button>
 <button type="button" data-tab="ranking" onclick="go('ranking')"><span>🏆</span>Ranking</button>
 <button type="button" data-tab="nutrition" onclick="go('nutrition')"><span>🥗</span>Nutrición</button>
</nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
// Respaldo global para evitar pantallas en blanco ante fallos de red/módulos/almacenamiento
window.__GB_BOOTED__ = false;
window.__GB_MEMORY_STORAGE__ = {};

window.__gbSafeStorageGet = function(k){
 try{
  if(window.localStorage) return window.localStorage.getItem(k);
 }catch(e){}
 return Object.prototype.hasOwnProperty.call(window.__GB_MEMORY_STORAGE__, k)
  ? window.__GB_MEMORY_STORAGE__[k]
  : null;
};

window.__gbSafeStorageSet = function(k, v){
 try{
  if(window.localStorage){
   window.localStorage.setItem(k, v);
   return true;
  }
 }catch(e){}
 window.__GB_MEMORY_STORAGE__[k] = String(v);
 return false;
};

window.__gbSafeStorageRemove = function(k){
 try{
  if(window.localStorage) window.localStorage.removeItem(k);
 }catch(e){}
 delete window.__GB_MEMORY_STORAGE__[k];
};

window.__gbRenderFallbackShell = function(reasonText){
 try{
  var mainEl = document.getElementById('main');
  var navEl = document.getElementById('nav');
  if(navEl) navEl.classList.add('hidden');
  if(mainEl && (!mainEl.innerHTML || !mainEl.innerHTML.trim())){
   mainEl.innerHTML =
    '<div class="card full-width profile" style="max-width:520px;margin:32px auto;">' +
     '<div class="avatar">💪</div>' +
     '<h2>Gym Bros · Modo seguro</h2>' +
     '<p class="muted">' + (reasonText || 'Cargando interfaz en modo local seguro...') + '</p>' +
     '<button type="button" class="btn" onclick="location.reload()">Reintentar carga</button>' +
    '</div>';
  }
 }catch(e){}
};

window.addEventListener('error', function(ev){
 try{
  console.warn('Error capturado en ventana:', ev && (ev.message || ev.error || ev));
  if(!window.__GB_BOOTED__){
   window.__gbRenderFallbackShell('Se detectó una restricción o error de red. Puedes reintentar o continuar en modo local.');
  }
 }catch(e){}
});

window.addEventListener('unhandledrejection', function(ev){
 try{
  console.warn('Promesa rechazada no controlada:', ev && ev.reason);
  if(!window.__GB_BOOTED__){
   window.__gbRenderFallbackShell('La conexión tardó o falló. Se ha habilitado el respaldo local seguro.');
  }
 }catch(e){}
});

setTimeout(function(){
 if(!window.__GB_BOOTED__){
  window.__gbRenderFallbackShell('El módulo tardó en responder; mostrando respaldo seguro.');
 }
}, 2500);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getFirestore,
 collection,
 doc,
 getDoc,
 setDoc,
 deleteDoc,
 onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const KEY='gym_bros_full_v6';
const ACTIVE_KEY='gym_bros_active';

const firebaseConfig={
 apiKey:"AIzaSyDjA-isaELcCkh81YGp8CdCuqa9qtkN_jQ",
 authDomain:"gym-bros-bfd3d.firebaseapp.com",
 projectId:"gym-bros-bfd3d",
 storageBucket:"gym-bros-bfd3d.firebasestorage.app",
 messagingSenderId:"206878572766",
 appId:"1:206878572766:web:6c7674c99b852bdaedc24f"
};

const COLS={
 users:'gym_bros_users',
 workouts:'gym_bros_workouts',
 foods:'gym_bros_foods',
 likes:'gym_bros_likes'
};

let db;
try{
 db=JSON.parse(window.__gbSafeStorageGet(KEY)||'null');
}catch(e){db=null}

if(!db || typeof db !== 'object' || !Array.isArray(db.users)){
 db={users:[],workouts:[],foods:[],likes:[],settings:{}};
}

db.users = Array.isArray(db.users) ? db.users : [];
db.workouts = Array.isArray(db.workouts) ? db.workouts : [];
db.foods = Array.isArray(db.foods) ? db.foods : [];
db.likes = Array.isArray(db.likes) ? db.likes : [];
db.settings = (db.settings && typeof db.settings === 'object') ? db.settings : {};

let firestoreDb=null;
let auth=null;
let cloudReady=false;
let syncingInProgress=false;
let currentUserAuth=null;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $=id=>document.getElementById(id);

function formatLocalDate(d){
 const dt = d instanceof Date ? d : new Date();
 const y = dt.getFullYear();
 const m = String(dt.getMonth()+1).padStart(2,'0');
 const day = String(dt.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}

const today=()=>formatLocalDate(new Date());

function daysAgoDateStr(daysBack){
 const d=new Date();
 d.setDate(d.getDate()-daysBack);
 return formatLocalDate(d);
}

function matchesTimeRange(dateStr, range){
 if(!range || range==='all') return true;
 if(!dateStr) return false;
 const t=today();
 if(range==='today') return dateStr===t;
 if(range==='week'){
  const minDate=daysAgoDateStr(6);
  return dateStr>=minDate && dateStr<=t;
 }
 return true;
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function isFormInputFocused(){
 const activeEl=document.activeElement;
 return Boolean(activeEl && (
  activeEl.tagName==='INPUT' ||
  activeEl.tagName==='TEXTAREA' ||
  activeEl.tagName==='SELECT'
 ));
}

function updateSyncBadge(status,labelText){
 const badge=$('sync-badge');
 const label=$('sync-label');
 if(!badge||!label)return;
 label.textContent=labelText;
 badge.classList.toggle('offline',status!=='online');
 badge.title=status==='online'
  ?'Sincronizado en tiempo real con Firebase Firestore (respaldo local activo)'
  :'Sin conexión a la nube: usando caché local seguro';
}

function save(){
 try{
  window.__gbSafeStorageSet(KEY,JSON.stringify(db));
 }catch(e){
  console.warn('No se pudo guardar en almacenamiento local:',e);
 }
}

function sanitizeCloudProfile(user){
 if(!user)return null;
 return {
  id:user.id,
  name:user.name||'Mi perfil',
  email:user.email||'',
  age:Number(user.age)||18,
  level:user.level||'Principiante',
  goal:user.goal||'Salud y bienestar',
  schedule:user.schedule||'Variable',
  gym:user.gym||'',
  bio:user.bio||'',
  avatar:user.avatar||'🏋️',
  weeklyGoal:Number(user.weeklyGoal)||3
 };
}

async function cloudSet(colName,id,payload,toastMsg=''){
 if(!cloudReady||!firestoreDb||!id){
  if(toastMsg) msg(`${toastMsg} (guardado localmente)`);
  return false;
 }
 try{
  updateSyncBadge('online','Sincronizando...');
  await setDoc(doc(firestoreDb,colName,id),payload,{merge:true});
  updateSyncBadge('online','Nube en vivo');
  if(toastMsg) msg(`${toastMsg} · Local y nube`);
  return true;
 }catch(e){
  console.error(`Error guardando en ${colName}/${id}:`,e);
  updateSyncBadge('offline','Respaldo local');
  if(toastMsg) msg(`${toastMsg} · Solo local (revisando nube)`);
  return false;
 }
}

async function cloudDelete(colName,id,toastMsg=''){
 if(!cloudReady||!firestoreDb||!id){
  if(toastMsg) msg(`${toastMsg} (eliminado localmente)`);
  return false;
 }
 try{
  updateSyncBadge('online','Sincronizando...');
  await deleteDoc(doc(firestoreDb,colName,id));
  updateSyncBadge('online','Nube en vivo');
  if(toastMsg) msg(`${toastMsg} · Local y nube`);
  return true;
 }catch(e){
  console.error(`Error eliminando en ${colName}/${id}:`,e);
  updateSyncBadge('offline','Respaldo local');
  if(toastMsg) msg(`${toastMsg} · Solo local`);
  return false;
 }
}

function msg(s){
 const t=$('toast');
 if(!t) return;
 t.textContent=s;
 t.style.display='block';
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{ if($('toast')) $('toast').style.display='none'; },2600);
}

function getUser(id){
 return db.users.find(u=>u.id===id);
}

function current(){
 return getUser(meId);
}

let meId=window.__gbSafeStorageGet(ACTIVE_KEY);
if(!getUser(meId)){
 meId=null;
 window.__gbSafeStorageRemove(ACTIVE_KEY);
}

let tab='home';

function syncNavActive(t){
 document.querySelectorAll('nav button').forEach(b=>{
  b.classList.toggle('active',b.dataset.tab===t);
 });
}

function go(t){
 if(!current() && t !== 'account'){
  tab = 'account';
  render();
  return;
 }
 tab=t;
 if(t!=='progress'){
  window.filterWorkoutSearch='';
  window.filterWorkoutEx='';
  window.filterWorkoutRange='all';
 }
 if(t!=='nutrition'){
  window.filterFoodSearch='';
  window.filterFoodMeal='';
  window.filterFoodRange='all';
 }
 if(t!=='discover'){
  window.filterConnGoal='';
  window.filterConnSchedule='';
 }

 render();
 syncNavActive(t);
}

function render(){
 const activeUser = current();
 const navEl = $('nav');

 if(!activeUser){
  if(navEl) navEl.classList.add('hidden');
  account();
  return;
 } else {
  if(navEl) navEl.classList.remove('hidden');
 }

 if(isFormInputFocused() && (tab === 'progress' || tab === 'nutrition' || tab === 'account')) {
  syncNavActive(tab);
  return;
 }

 ({
  home,discover,progress,ranking,nutrition,account
 }[tab]||home)();
 syncNavActive(tab);
}

async function syncLocalDataToCloud(){
 if(!cloudReady||!firestoreDb||syncingInProgress)return;
 syncingInProgress=true;
 try{
  for(const u of db.users){
   const safeUser=sanitizeCloudProfile(u);
   if(safeUser)await setDoc(doc(firestoreDb,COLS.users,u.id),safeUser,{merge:true});
  }
  for(const w of db.workouts){
   if(w.id)await setDoc(doc(firestoreDb,COLS.workouts,w.id),w,{merge:true});
  }
  for(const f of db.foods){
   if(f.id)await setDoc(doc(firestoreDb,COLS.foods,f.id),f,{merge:true});
  }
  for(const l of db.likes){
   if(l.id)await setDoc(doc(firestoreDb,COLS.likes,l.id),l,{merge:true});
  }
 }catch(e){
  console.warn('Sincronización inicial parcial:',e);
 }finally{
  syncingInProgress=false;
 }
}

function subscribeCloudCollections(){
 if(!cloudReady||!firestoreDb)return;

 try{
  onSnapshot(collection(firestoreDb,COLS.users),(snap)=>{
   const cloudUsers=snap.docs.map(d=>({id:d.id,...d.data()}));
   const localById=new Map(db.users.map(u=>[u.id,u]));
   const mergedUsers=cloudUsers.map(cu=>{
    const localMatch=localById.get(cu.id);
    return {
     ...cu,
     pass:localMatch?.pass||'',
     weeklyGoal:cu.weeklyGoal??localMatch?.weeklyGoal??3
    };
   });
   localById.forEach((lu,id)=>{
    if(!mergedUsers.some(mu=>mu.id===id)){
     mergedUsers.push(lu);
    }
   });
   db.users=mergedUsers;
   if(currentUserAuth && currentUserAuth.uid){
    const matchedByUid=db.users.find(u=>u.id===currentUserAuth.uid)
     || db.users.find(u=>(u.email||'').toLowerCase()===(currentUserAuth.email||'').toLowerCase());
    if(matchedByUid && meId!==matchedByUid.id){
     meId=matchedByUid.id;
     window.__gbSafeStorageSet(ACTIVE_KEY,meId);
    }
   }
   save();
   if(!isFormInputFocused()) render();
  },(err)=>{
   console.error('Error escuchando usuarios:',err);
   updateSyncBadge('offline','Respaldo local');
  });

  onSnapshot(collection(firestoreDb,COLS.workouts),(snap)=>{
   db.workouts=snap.docs.map(d=>({id:d.id,...d.data()}));
   save();

   if(!isFormInputFocused()) render();
  },(err)=>{console.error(err);});

  onSnapshot(collection(firestoreDb,COLS.likes),(snap)=>{
   db.likes=snap.docs.map(d=>({id:d.id,...d.data()}));
   save();
   if(!isFormInputFocused()) render();
  },(err)=>{console.error(err);});
 }catch(e){

}

async function ensureLinkedUserProfile(fbUser, fallbackName='', extraFields={}){
 const normEmail=(fbUser.email||'').trim().toLowerCase();
 let profile=db.users.find(u=>u.id===fbUser.uid)
  || db.users.find(u=>(u.email||'').trim().toLowerCase()===normEmail);

 if(!profile && firestoreDb){
  try{
   const directSnap=await getDoc(doc(firestoreDb,COLS.users,fbUser.uid));
   if(directSnap.exists()){
    profile={id:directSnap.id,...directSnap.data()};
   }
  }catch(e){
   console.warn('No se pudo leer perfil directo por UID:',e);
  }
 }

 const defaultName=fallbackName
  || fbUser.displayName
  || (normEmail ? normEmail.split('@')[0] : 'Usuario');

 if(!profile){
  profile={
   id:fbUser.uid,
   name:defaultName,
   email:normEmail,
   age:Number(extraFields.age)||18,
   level:extraFields.level||'Principiante',
   goal:extraFields.goal||'Salud y bienestar',
   schedule:extraFields.schedule||'Variable',
   gym:extraFields.gym||'',
   bio:extraFields.bio||'',
   avatar:extraFields.avatar||'🏋️',
   weeklyGoal:Number(extraFields.weeklyGoal)||3
  };
 } else {
  profile={
   ...profile,
   id:fbUser.uid,
   email:normEmail||profile.email||'',
   name:extraFields.name||profile.name||defaultName,
   age:extraFields.age!==undefined?Number(extraFields.age):(Number(profile.age)||18),
   level:extraFields.level||profile.level||'Principiante',
   goal:extraFields.goal||profile.goal||'Salud y bienestar',
   schedule:extraFields.schedule||profile.schedule||'Variable',
   weeklyGoal:extraFields.weeklyGoal!==undefined?Number(extraFields.weeklyGoal):(Number(profile.weeklyGoal)||3)
  };
 }

 db.users=db.users.filter(u=>u.id!==profile.id && (u.email||'').toLowerCase()!==normEmail);
 db.users.push(profile);
 meId=profile.id;
 window.__gbSafeStorageSet(ACTIVE_KEY,meId);
 save();
 await cloudSet(COLS.users,profile.id,sanitizeCloudProfile(profile));
 return profile;
}

async function processImportFile(){
 const fileInput=$('import-file');
 if(!fileInput || !fileInput.files || !fileInput.files.length)return msg('Selecciona un archivo JSON');
 const file=fileInput.files[0];
 const reader=new FileReader();
 reader.onload=async function(e){
  try{
   const imported=JSON.parse(e.target.result);
   if(!imported || typeof imported !== 'object'){
    return msg('Formato JSON inválido');
   }
   const me=current();
   if(!me) return msg('Inicia sesión para importar datos');
   let importedWorkoutsCount=0;
   let importedFoodsCount=0;

   if(imported.workouts && Array.isArray(imported.workouts)){
    for(const w of imported.workouts){
     if(w && typeof w.ex === 'string' && w.date){
      const cleanW={
       id: w.id || uid(),
       user: me.id,
       ex: String(w.ex).trim(),
       wt: Number(w.wt) || 0,
       st: Number(w.st) || 1,
       rp: Number(w.rp) || 1,
       date: String(w.date),
       nt: String(w.nt || '')
      };
      if(!db.workouts.some(existing=>existing.id===cleanW.id)){
       db.workouts.push(cleanW);
       await cloudSet(COLS.workouts,cleanW.id,cleanW);
       importedWorkoutsCount++;
      }
     }
    }
   }

   if(imported.foods && Array.isArray(imported.foods)){
    for(const f of imported.foods){
     if(f && typeof f.food === 'string' && f.date){
      const cleanF={
       id: f.id || uid(),
       user: me.id,
       food: String(f.food).trim(),
       meal: String(f.meal || 'Comida'),
       date: String(f.date),
       comment: String(f.comment || '')
      };
      if(!db.foods.some(existing=>existing.id===cleanF.id)){
       db.foods.push(cleanF);
       await cloudSet(COLS.foods,cleanF.id,cleanF);
       importedFoodsCount++;
      }
     }
    }
   }

   save();
   msg(`Importados: ${importedWorkoutsCount} entrenos, ${importedFoodsCount} comidas · Local y nube`);
   go('home');
  }catch(err){
   console.error(err);
   msg('Error al procesar el archivo JSON');
  }
 };
 reader.readAsText(file);
}

 const removedFoods=db.foods.filter(f=>f.user===meId).map(f=>f.id);
 const removedLikes=db.likes.filter(l=>l.from===meId||l.to===meId).map(l=>l.id);

 db.workouts=db.workouts.filter(w=>w.user!==meId);
 db.foods=db.foods.filter(f=>f.user!==meId);
 db.likes=db.likes.filter(l=>l.from!==meId&&l.to!==meId);
 save();

 for(const id of removedWorkouts) await cloudDelete(COLS.workouts,id);
 for(const id of removedFoods) await cloudDelete(COLS.foods,id);
 for(const id of removedLikes) await cloudDelete(COLS.likes,id);

 go('home');
 msg('Registros eliminados · Local y nube');
}

function computePersonalRecords(workouts){
 const prMap=new Map();
 for(const w of workouts){
  const key=(w.ex||'').trim();
  if(!key) continue;
  const wt=Number(w.wt)||0;
  const st=Number(w.st)||0;
  const rp=Number(w.rp)||0;
  const vol=wt*st*rp;
  const prev=prMap.get(key)||{
   exercise:key,
   maxWeight:0,
   maxWeightDate:'',
   maxVolume:0,
   maxVolumeDate:'',
   maxVolumeDetail:''
  };
  if(wt>=prev.maxWeight){
   prev.maxWeight=wt;
   prev.maxWeightDate=w.date||'';
  }
  if(vol>=prev.maxVolume){
   prev.maxVolume=vol;
   prev.maxVolumeDate=w.date||'';
   prev.maxVolumeDetail=`${wt} kg × ${st}×${rp}`;
  }
  prMap.set(key,prev);
 }
 return [...prMap.values()].sort((a,b)=>b.maxVolume-a.maxVolume || b.maxWeight-a.maxWeight);
}

function renderPersonalRecords(prs){
 if(!prs.length){
  return '<p class="muted">Registra entrenamientos con peso, series y repeticiones para calcular tus récords personales (PR).</p>';

 return `<div class="pr-grid">

    <b>${esc(pr.exercise)}</b>
    <small>🏋️ Mayor peso: <b>${pr.maxWeight} kg</b> ${pr.maxWeightDate?`(${esc(pr.maxWeightDate)})`:''}</small>
    <small>⚡ Mayor volumen: <b>${Math.round(pr.maxVolume).toLocaleString('es-MX')} kg</b> ${pr.maxVolumeDetail?`[${esc(pr.maxVolumeDetail)}]`:''}</small>
   </div>`).join('')}

}

 allW.forEach(w=>{

    </div>
   </div>
  </div>`).join('');
}

function setFoodRange(range){
 window.filterFoodRange=range;
 applyFoodFilters();
}

function applyFoodFilters(){
 window.filterFoodSearch=$('f-search')?.value||'';
 window.filterFoodMeal=$('f-meal-filter')?.value||'';
 const rangeVal=window.filterFoodRange||'all';
 document.querySelectorAll('.chip-group .chip-btn').forEach(btn=>{
  const txt=btn.textContent.trim();
  const matches=(rangeVal==='all'&&txt==='Todos')||(rangeVal==='today'&&txt==='Hoy')||(rangeVal==='week'&&txt==='Esta semana');
  btn.classList.toggle('active',matches);
 });
 const me=current();
 if(!me) return;
 const allF=db.foods.filter(f=>f.user===me.id).sort((x,y)=>y.date.localeCompare(x.date));
 const a=getFilteredFoods(allF);
 const container=$('food-list-container');
 if(container) container.innerHTML = renderFoodList(a);
}

function resetFoodFilters(){
 window.filterFoodSearch='';
 window.filterFoodMeal='';
 window.filterFoodRange='all';
 if($('f-search')) $('f-search').value='';
 if($('f-meal-filter')) $('f-meal-filter').value='';
 applyFoodFilters();
}

async function addFood(){
 const me=current();
 if(!me) return;
 const food=$('food').value.trim(),date=$('fd').value;
 if(!food||!date)return msg('Escribe el alimento y la fecha');
 const item={id:uid(),user:meId,food,meal:$('meal').value,date,comment:$('fc').value.trim()};
 db.foods.push(item);
 save();
 await cloudSet(COLS.foods,item.id,item,'Comida guardada');
 nutrition();
}

function editFoodPrompt(id){
 const me=current();
 if(!me) return;
 const f=db.foods.find(x=>x.id===id && x.user===meId);
 if(!f)return;
 $('main').innerHTML=`
 <div class="card full-width" style="max-width:600px;margin:auto;">
  <h2>Editar comida</h2>
  <label>Alimento</label>
  <input id="edit-food" value="${esc(f.food)}">
  <label>Tipo de comida</label>
  <select id="edit-meal">
   ${['Desayuno','Comida','Cena','Colación','Otra'].map(m=>`<option ${f.meal===m?'selected':''}>${m}</option>`).join('')}
  </select>
  <label>Fecha</label>
  <input id="edit-fd" type="date" value="${f.date}">
  <label>Comentario</label>
  <textarea id="edit-fc">${esc(f.comment)}</textarea>
  <button type="button" class="btn" onclick="saveEditedFood('${f.id}')">Guardar cambios</button>
  <button type="button" class="btn outline" onclick="go('nutrition')">Cancelar</button>
 </div>`;
}

async function saveEditedFood(id){
 const me=current();
 if(!me) return;
 const f=db.foods.find(x=>x.id===id && x.user===meId);
 if(!f)return;
 const food=$('edit-food').value.trim(),date=$('edit-fd').value;
 if(!food||!date)return msg('Completa correctamente los campos');
 f.food=food; f.meal=$('edit-meal').value; f.date=date; f.comment=$('edit-fc').value.trim();
 save();
 await cloudSet(COLS.foods,f.id,f,'Comida actualizada');
 nutrition();
}

async function delFood(id){
 const me=current();
 if(!me) return;
 if(!confirm('¿Eliminar este registro?'))return;
 db.foods=db.foods.filter(f=>f.id!==id||f.user!==meId);
 save();
 await cloudDelete(COLS.foods,id,'Comida eliminada');
 nutrition();
}

Object.assign(window,{
 go,editProfile,saveProfile,loginForm,login,registerForm,register,
 switchAccount,useAccount,logout,logoutCloud,pass,like,connections,
 addWorkout,delWorkout,editWorkoutPrompt,saveEditedWorkout,
 applyWorkoutFilters,resetWorkoutFilters,setWorkoutRange,
 addFood,delFood,editFoodPrompt,saveEditedFood,
 applyFoodFilters,resetFoodFilters,setFoodRange,
 exportData,importDataPrompt,processImportFile,resetMyData,
 applyConnFilters,resetConnFilters,togglePassVisibility
});

save();
if(!meId){
 go('account');
} else {
 go('home');
}
window.__GB_BOOTED__ = true;
initCloud();
</script>
